name: Publish PathFlow Python Package to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Build & Publish pathflow to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for PyPI OIDC Trusted Publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Run SDK unit tests
        run: |
          PYTHONPATH=sdk-package python -m unittest discover -s sdk-package/tests

      - name: Build sdist and wheel distributions
        run: |
          cd sdk-package
          python -m build

      - name: Run Twine check on built distributions
        run: |
          twine check sdk-package/dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk-package/dist/
