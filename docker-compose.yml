version: '3.8'

services:
  pathflow-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pathflow_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - PATHFLOW_API_KEY=pf_live_secret_key
    volumes:
      - pathflow_db_data:/app/prisma
    # `npm run build` no longer creates or seeds the database, so create the
    # SQLite schema at container start (no-op when it is already up to date).
    command: sh -c "npx prisma db push --skip-generate && node server.js"
    restart: unless-stopped

volumes:
  pathflow_db_data:
    driver: local
