[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pathflow"
version = "0.1.0"
description = "Lightweight, zero-config AI Agent Execution Profiler and Telemetry SDK for PathFlow"
readme = "README.md"
authors = [
    { name = "PathFlow Team", email = "support@pathflow.dev" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring"
]
keywords = ["ai", "agents", "observability", "telemetry", "opentelemetry", "tracing", "profiling", "pathflow"]
dependencies = []

[project.urls]
Homepage = "https://pathflow.dev"
Repository = "https://github.com/anothercodingguy/pathflow"

[tool.setuptools.packages.find]
where = ["."]
include = ["pathflow*"]
